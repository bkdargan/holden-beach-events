name: Normalize Events

on:
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: List Files
        run: |
          pwd
          ls -la

      - name: Show All Events Before Normalizing
        run: |
          cat all_events.json

      - name: Run Normalizer
        run: |
          python scripts/normalize_events.py

      - name: Show Normalized Events
        run: |
          cat normalized_events.json

      - name: Commit Normalized Events
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add normalized_events.json

          git diff --staged --quiet || git commit -m "Update normalized events"

          git push
