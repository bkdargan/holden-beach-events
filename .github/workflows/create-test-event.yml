name: Create Test Event

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Verify Google Secrets
        run: |
          echo "Testing Google configuration..."

          if [ -z "${{ secrets.GOOGLE_CALENDAR_ID }}" ]; then
            echo "Calendar ID missing"
            exit 1
          fi

          if [ -z "${{ secrets.GOOGLE_CREDENTIALS }}" ]; then
            echo "Credentials missing"
            exit 1
          fi

          echo "Google secrets found successfully"
