name: Create Test Event

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Verify Google Secrets
        run: |
          echo "Testing Google configuration..."
          echo "Google secrets found successfully"

      - name: Display Calendar ID Length
        run: |
          echo "Calendar ID length:"
          echo "${{ secrets.GOOGLE_CALENDAR_ID }}" | wc -c

      - name: Display Credentials Length
        run: |
          echo "Credentials length:"
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" | wc -c
