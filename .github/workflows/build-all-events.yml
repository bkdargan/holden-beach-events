name: Build All Events

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build All Events
        run: |
          python scripts/build_all_events.py

      - name: Show HB Town Hall Events
        run: |
          cat hbtownhall.json

      - name: Show NC Brunswick Events
        run: |
          cat ncbrunswick.json

      - name: Show All Events
        run: |
          cat all_events.json

      - name: Commit All Events
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add all_events.json
          git add hbtownhall.json
          git add ncbrunswick.json

          git diff --staged --quiet || git commit -m "Update all events"

          git push
