name: Brunswick Event Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Brunswick Import Test
        shell: pwsh
        run: ./scripts/Get-BrunswickEvents.ps1

      - name: Upload Events JSON
        uses: actions/upload-artifact@v4
        with:
          name: events-json
          path: events.json

      - name: Show Events JSON
        run: |
          cat events.json
