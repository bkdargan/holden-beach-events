name: Brunswick Event Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: |
          pip install requests

      - name: Discover Events
        run: |
          python scripts/discover_events.py

      - name: Show concerts.json
        run: |
          cat concerts.json

      - name: Commit concerts.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add concerts.json

          git diff --staged --quiet || git commit -m "Update concerts.json"

          git push
